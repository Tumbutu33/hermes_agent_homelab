# EN: Location: ~/.config/systemd/user/hermes-workspace.service.d/override.conf
#     Created with: systemctl --user edit hermes-workspace
#     Without this line the service may start without reading the .env:
#     the interface doesn't ask for a password and chat shows "Authentication error".
#
# ES: Ubicación: ~/.config/systemd/user/hermes-workspace.service.d/override.conf
#     Se crea con: systemctl --user edit hermes-workspace
#     Sin esta línea, el servicio puede arrancar sin leer el .env:
#     la interfaz no pide contraseña y el chat da "Authentication error".
[Service]
EnvironmentFile=/home/hermes/hermes-workspace/.env
